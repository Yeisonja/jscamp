<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="listado con empleos y filtros para encontrar el trabajo de tus sueños"
		/>
		<title>DevJobs - Empleos</title>
		<link rel="stylesheet" href="./style.css" />

		<script src="./main.js" type="module"></script>
	</head>
	<body>
		<header>
			<h1>
				<svg
					xmlns="http://www.w3.org/2000/svg"
					width="24"
					height="24"
					viewBox="0 0 24 24"
					fill="none"
					stroke="currentColor"
					stroke-width="1"
					stroke-linecap="round"
					stroke-linejoin="round"
					class="icon icon-tabler icons-tabler-outline icon-tabler-code"
				>
					<path stroke="none" d="M0 0h24v24H0z" fill="none" />
					<path d="M7 8l-4 4l4 4" />
					<path d="M17 8l4 4l-4 4" />
					<path d="M14 4l-4 16" />
				</svg>
				DevJobs
			</h1>

			<nav>
				<a href="./index.html">Inicio</a>
				<a href="./empleos.html">Empleos</a>
			</nav>

			<div>
				<!-- <a href="">Publicar un empleo</a>
				<a href="">Iniciar sesión</a> -->
				<!-- cargamos el webComponent -->
				<devjobs-avatar
					service="github"
					username="yeisonja"
					size="32"
				></devjobs-avatar>

				<devjobs-avatar
					service="github"
					username="yeisonja"
					size="20"
				></devjobs-avatar>
			</div>
		</header>
		<main>
			<section class="jobs-search">
				<h1>Encuentra tu próximo trabajo</h1>
				<p>Explora miles de oportunidades en el sector tecnológico.</p>
				<form id="empleos-search-form" role="search">
					<div class="search-bar">
						<svg
							xmlns="http://www.w3.org/2000/svg"
							width="24"
							height="24"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="1.25"
							stroke-linecap="round"
							stroke-linejoin="round"
							class="icon icon-tabler icons-tabler-outline icon-tabler-search"
						>
							<path stroke="none" d="M0 0h24v24H0z" fill="none" />
							<path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" />
							<path d="M21 21l-6 -6" />
						</svg>

						<input
							name="search"
							id="empleos-search-input"
							required
							type="text"
							placeholder="Buscar trabajos, empresas o habilidades"
						/>
					</div>

					<div class="search-filters">
						<select name="technology" id="filter-technology">
							<option value="">Tecnología</option>
							<option value="javascript">JavaScript</option>
							<option value="python">Python</option>
							<option value="java">Java</option>
							<option value="react">React</option>
							<option value="nodejs">Node.js</option>
						</select>

						<select name="location" id="filter-location">
							<option value="">Ubicación</option>
							<option value="remoto">Remoto</option>
							<option value="cdmx">Ciudad de México</option>
							<option value="guadalajara">Guadalajara</option>
							<option value="monterrey">Monterrey</option>
							<option value="barcelona">Barcelona</option>
						</select>

						<select name="experience-level" id="filter-experience-level">
							<option value="">Nivel de experiencia</option>
							<option value="junior">Junior</option>
							<option value="mid">Mid-level</option>
							<option value="senior">Senior</option>
							<option value="lead">Lead</option>
						</select>
					</div>
				</form>

				<span id="filters-selected-value"></span>
			</section>

			<section>
				<h2>Resultados de búsqueda</h2>
				<div class="jobs-listing">
					<!-- aquí se van a insertar los empleos dinámicamente -->
				</div>

				<!-- paginación -->
				<nav class="pagination">
					<a href="#"
						><svg
							xmlns="http://www.w3.org/2000/svg"
							width="24"
							height="24"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round"
							class="icon icon-tabler icons-tabler-outline icon-tabler-chevron-left"
						>
							<path stroke="none" d="M0 0h24v24H0z" fill="none" />
							<path d="M15 6l-6 6l6 6" /></svg
					></a>
					<!-- flecha atrás -->
					<a class="is-active" href="#">1</a>
					<a href="#">2</a>
					<a href="#">3</a>
					<a href="#">4</a>
					<a href="#">5</a>
					<a href="#"
						><svg
							xmlns="http://www.w3.org/2000/svg"
							width="24"
							height="24"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round"
							class="icon icon-tabler icons-tabler-outline icon-tabler-chevron-right"
						>
							<path stroke="none" d="M0 0h24v24H0z" fill="none" />
							<path d="M9 6l6 6l-6 6" /></svg
					></a>
					<!-- flecha adelante -->
				</nav>
			</section>
		</main>
		<footer>
			<small>&copy; 2026 DevJobs. Todos los derechos reservados.</small>
		</footer>
	</body>
</html>
